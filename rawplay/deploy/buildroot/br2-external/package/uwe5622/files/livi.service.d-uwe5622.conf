# Installed by the uwe5622 package. livi-helperd makes its one BlueZ
# connection when livi-core starts and never retries, so livi-core is
# ordered after the hci attach: uwe5622-bluetooth.service only completes its start
# when /sys/class/bluetooth/hci0 exists, and BlueZ activation plus the
# car-kit profile registration then succeed on the first try.
[Unit]
After=uwe5622-bluetooth.service
Wants=uwe5622-bluetooth.service
