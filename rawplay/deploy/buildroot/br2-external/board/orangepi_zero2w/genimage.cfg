# Orange Pi Zero 2W, GPT, 1 MiB partition alignment (the sunxi boot ROM reads
# SPL from 8 KiB and the MBR/GPT lives after it). The boot FAT and the data
# partition are prebuilt images; the rootfs squashfs is Buildroot's output.
image sdcard.img {
    hdimage {
        partition-table-type = "gpt"
        gpt-location = 1008K
        gpt-no-backup = true
    }

    partition u-boot {
        in-partition-table = false
        image = "u-boot-sunxi-with-spl.bin"
        offset = 8K
        size = 1000K
    }

    partition boot {
        partition-type-uuid = U
        offset = 1M
        image = "boot.vfat"
        bootable = true
    }

    partition rootfs {
        partition-type-uuid = L
        image = "rootfs.squashfs"
    }

    partition data {
        partition-type-uuid = L
        image = "data.ext4"
    }
}
