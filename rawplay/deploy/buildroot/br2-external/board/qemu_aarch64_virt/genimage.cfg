# qemu virt, GPT. One disk with the same shape as the board's SD card: the
# read-only squashfs root first, the labelled ext4 data partition second.
# A single disk keeps the kernel's virtio device naming out of the boot:
# root is always /dev/vda1, and livi-persist finds the data by label.
image disk.img {
    hdimage {
        partition-table-type = "gpt"
    }

    partition rootfs {
        partition-type-uuid = L
        image = "rootfs.squashfs"
        bootable = true
    }

    partition data {
        partition-type-uuid = L
        image = "data.ext4"
    }
}
